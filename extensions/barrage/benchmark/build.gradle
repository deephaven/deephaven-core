plugins {
    id 'io.deephaven.project.register'
}

description 'Barrage Benchmark: Benchmarks for Barrage message serialization/deserialization'

dependencies {
    implementation project(':extensions-barrage')
    implementation project(':engine-table')
    implementation project(':BenchmarkSupport')
    implementation libs.arrow.vector
    implementation libs.flatbuffers.java
    implementation platform(libs.grpc.bom)
    implementation libs.grpc.api
    implementation TestTools.projectDependency(project, 'engine-rowset')
    implementation TestTools.projectDependency(project, 'engine-table')

    annotationProcessor libs.jmh.generator.annprocess
    compileOnly libs.jmh.generator.annprocess

    runtimeOnly project(':configs')
    runtimeOnly project(':test-configs')
}

def createJmhTask = {
    taskName, cliArgs, jvmAddArgs=[], heapSize='8g' -> tasks.create(taskName, JavaExec, { JavaExec task ->
        new File("$rootDir/tmp/workspace").mkdirs()
        new File("$rootDir/tmp/logs").mkdirs()

        task.workingDir "$rootDir/tmp/workspace"
        task.classpath = sourceSets.main.runtimeClasspath
        task.mainClass.set 'io.deephaven.benchmarking.runner.BenchmarkRunner'

        // arguments to pass to the application
        def jvmArgs = [ '-DConfiguration.rootFile=dh-tests.prop',
                "-Dworkspace=$rootDir/tmp/workspace",
                '-Dconfiguration.quiet=true',
                '-Djava.awt.headless=true',
                '-DQueryTable.memoizeResults=false',
                "-Xmx$heapSize"
        ]
        jvmArgs.addAll(jvmAddArgs)
        task.jvmArgs jvmArgs
        // cliArgs may be a single benchmark name or a list of JMH command-line arguments
        task.setArgs(([] + cliArgs).flatten().collect { it.toString() })

        return
    })
}

createJmhTask('jmhRunBarrageRoundTrip', 'BarrageMessageRoundTripBenchmark')

// The String arm runs fewer columns than the primitive default: String cells are wide enough that 5000 columns of
// them split the snapshot across record batches, which the single-batch reader in this benchmark cannot parse.
createJmhTask('jmhRunBarrageRoundTripStrings',
        ['BarrageMessageRoundTripBenchmark', '-p', 'columnType=String', '-p', 'numColumns=1000'])
