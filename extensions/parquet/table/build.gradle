plugins {
    id 'java-library'
    id 'io.deephaven.project.register'
}
import io.deephaven.tools.docker.Architecture

evaluationDependsOn Docker.registryProject('localstack')
evaluationDependsOn Docker.registryProject('minio')

description 'Parquet Table: Integrating Engine tables with Parquet'



sourceSets {
    brotliTest {}
}

// Order matters, declare configurations after sourceSets https://github.com/gradle/gradle/issues/26255
configurations {
    brotliTestImplementation.extendsFrom(testImplementation)
}

dependencies {
    api project(':engine-api')
    api project(':engine-stringset')
    api project(':engine-table')
    api project(':codec-api')

    implementation project(':extensions-parquet-base')
    implementation libs.parquet.hadoop

    implementation project(':engine-base')
    implementation project(':extensions-csv')
    implementation project(':log-factory')
    implementation project(':Configuration')
    implementation project(':Util')
    implementation project(':codec-builtin')
    implementation project(':codec-cache')

    implementation libs.commons.lang3
    implementation libs.dsi.fastutil
    implementation libs.commons.text
    implementation libs.commons.compress

    implementation platform(libs.jackson.bom)
    implementation libs.jackson.dataformat.yaml
    implementation libs.jackson.datatype.jdk8

    implementation libs.guava

    compileOnly project(':util-immutables')
    annotationProcessor libs.immutables.value

    compileOnly libs.google.findbugs.jsr305

    testImplementation project(':base-test-utils')
    testImplementation project(':engine-test-utils')

    testImplementation(libs.hadoop.common) {
        transitive = false
        because 'need to write parquet using hadoop directly for UINT64 testing'
    }

    testImplementation TestTools.projectDependency(project, 'extensions-s3')
    testImplementation libs.junit4

    testImplementation libs.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.minio

    testRuntimeOnly project(':log-to-slf4j'),
            project(':configs'),
            project(':test-configs')
    testRuntimeOnly libs.slf4j.simple

    testCompileOnly libs.autoservice
    testAnnotationProcessor libs.autoservice.compiler

    runtimeOnly project(':extensions-trackedfile')

    brotliTestImplementation project(':extensions-parquet-table')
    brotliTestImplementation(libs.rdblue.brotli.codec)
    brotliTestRuntimeOnly project(':log-to-slf4j'),
                         project(':configs'),
                         project(':test-configs')
}

// if architecture is x86, run the brotli test
if (Architecture.fromHost() == Architecture.AMD64) {
    check.dependsOn(tasks.register('brotliTest', Test) {
        classpath = sourceSets.brotliTest.runtimeClasspath
        testClassesDirs = sourceSets.brotliTest.output.classesDirs
    })
}

// DH-23557: pushdown fuzzer bench. Deliberately NOT wired into `check` or `nightly` -- the root
// `nightly` task matches tasks by name (check/testOutOfBand/testSerial/testParallel), so this
// task runs only on explicit request. We do hook its *compilation* into `check` so it cannot rot.
testing {
    suites {
        pushdownFuzzTest(JvmTestSuite) {
            useJUnit(libs.versions.junit4.get())
            sources {
                java {
                    srcDirs = ['src/pushdownFuzzTest/java']
                }
            }
            dependencies {
                implementation project(':extensions-parquet-table')
                implementation project(':engine-api')
                implementation project(':engine-table')
                implementation project(':table-api')
                implementation project(':engine-test-utils')
                implementation project(':base-test-utils')
                implementation project(':engine-rowset')
                implementation project(':engine-chunk')
                implementation project(':engine-query-constants')
                implementation project(':engine-time')
                implementation project(':Configuration')
                implementation project(':Util')
                implementation project(':Base')
                runtimeOnly project(':log-to-slf4j')
                runtimeOnly project(':configs')
                runtimeOnly project(':test-configs')
                runtimeOnly project(':extensions-trackedfile')
            }
        }
    }
}

tasks.named('pushdownFuzzTest', Test) {
    group = '~Deephaven Test'
    description = 'DH-23557 pushdown fuzzer. Not run by check or nightly; run on demand.'
    maxHeapSize = (findProperty('maxHeapSize') ?: '6g').toString()
    maxParallelForks = 1
    testLogging.showStandardStreams = true

    // Forward -DPushdownFuzzer.* knobs from the gradle JVM into the test JVM.
    System.properties.each { k, v ->
        if (k.toString().startsWith('PushdownFuzzer.')) {
            systemProperty k.toString(), v.toString()
        }
    }

    // QueryTable.FORCE_PARALLEL_WHERE and friends are package-private to io.deephaven.engine.table.impl,
    // so the bench cannot set them directly; drive them through their config properties instead.
    def parallelWhere = (findProperty('fuzzParallelWhere') ?: 'default').toString()
    if (parallelWhere == 'force') {
        systemProperty 'QueryTable.forceParallelWhere', 'true'
        systemProperty 'QueryTable.disableParallelWhere', 'false'
        // Small segments so even a modest table splits into many parallel where segments.
        systemProperty 'QueryTable.parallelWhereRowsPerSegment', '64'
    } else if (parallelWhere == 'disable') {
        systemProperty 'QueryTable.forceParallelWhere', 'false'
        systemProperty 'QueryTable.disableParallelWhere', 'true'
    } else if (parallelWhere != 'default') {
        throw new GradleException("Unknown -PfuzzParallelWhere=$parallelWhere (default|force|disable)")
    }

    // The PredicatePushdown.*Cost constants are `static final`, read once at class-init, so a cost
    // ordering is a per-JVM choice rather than a per-case one. -PfuzzCostProfile permutes it.
    def profile = (findProperty('fuzzCostProfile') ?: 'default').toString()
    def costNames = ['tableSingleValueColumnCost', 'tableSortedDataCost', 'tableInMemoryDataIndexCost',
                     'regionSingleValueCost', 'locationInMemoryDataIndexCost', 'regionMetadataStatsCost',
                     'regionBloomFilterCost', 'locationDeferredDataIndexCost', 'regionSortedDataCost',
                     'regionDictionaryDataCost']
    if (profile == 'inverted') {
        costNames.eachWithIndex { name, i ->
            systemProperty "PredicatePushdown.$name", ((costNames.size() - i) * 5000).toString()
        }
    } else if (profile == 'allEqual') {
        costNames.each { systemProperty "PredicatePushdown.$it", '10000' }
    } else if (profile != 'default') {
        throw new GradleException("Unknown -PfuzzCostProfile=$profile (default|inverted|allEqual)")
    }
}

// Compile-only in CI so the bench cannot rot; the tests themselves never run there.
tasks.named('check') { dependsOn tasks.named('compilePushdownFuzzTestJava') }

TestTools.addEngineOutOfBandTest(project)

testOutOfBand.dependsOn Docker.registryTask(project, 'localstack')
testOutOfBand.systemProperty 'testcontainers.localstack.image', Docker.localImageName('localstack')

testOutOfBand.dependsOn Docker.registryTask(project, 'minio')
testOutOfBand.systemProperty 'testcontainers.minio.image', Docker.localImageName('minio')
