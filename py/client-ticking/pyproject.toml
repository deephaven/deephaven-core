[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[tool.mypy]
namespace_packages = true
exclude = ["tests", "demos", "build"]

[[tool.mypy.overrides]]
module = [
  "pyarrow.*",
  "pydeephaven_ticking._core",
  "Cython.*"
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
lint.select = ["F", "I", "UP006", "UP007", "UP035", "UP036", "UP045"]
exclude = []

[tool.ruff.format]
exclude = []
