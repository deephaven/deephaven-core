plugins {
    id 'io.deephaven.python-wheel'
    id 'java-library'
}

evaluationDependsOn ':docker-server-jetty'
// For its deephaven.javaOpts / JAVA_OPTS override, which replaces the default VM options in the wheel
evaluationDependsOn ':py-embedded-server-java-runtime'

configurations {
    classpath
}
wheel {
    contents {
        include 'deephaven_server/', 'setup.py', 'README.md', 'README_PyPi.md', 'requirements-dev.txt', 'pyproject.toml'
        from(configurations.classpath) {
            include '*'
            into('deephaven_server/jars')
        }
    }
    src 'deephaven_server'
}

dependencies {
    classpath project(path: ':py-embedded-server-java-runtime', targetConfiguration: 'fullClasspath')
    pythonWheel project(':py-server')
    api(project(':Integrations')) {
        because 'downstream dagger compile'
    }

    implementation project(":util-processenvironment")
}

def testEmbeddedServer = Docker.registerDockerTask(project, 'testEmbeddedServer') {
    copyIn {
        from('tests') {
            into 'project/tests'
        }
        from(tasks.getByName('buildWheel')) {
            into 'wheels'
        }
        from(configurations.pythonWheel) {
            into 'wheels'
        }
        from ('requirements-dev.txt') {
            into 'project/'
        }
    }
    dockerfile {
        // Start from the image that built our wheel, so it is already ready to go
        from(Docker.localImageName('server-jetty'))
        copyFile('project', '/project')
        copyFile('wheels', '/wheels')

        workingDir('/project')
        // test_vmoptions.py expects an override of the default VM options instead of the defaults
        def javaOptsOverride = project(':py-embedded-server-java-runtime').deephavenJavaOptsOverride
        if (javaOptsOverride != null) {
            environmentVariable('DH_JAVA_OPTS_OVERRIDE', '"' + javaOptsOverride.join(' ') + '"')
        }
        runCommand '''set -eux; \\
                      mkdir -p /out/report; \\
                      pip install --upgrade pip; \\
                      pip3 install -r requirements-dev.txt; \\
                      pip3 install /wheels/*'''
    }
    parentContainers = [ project(':docker-server-jetty').tasks.findByName('buildDocker-server-jetty') ]
    entrypoint = ['python', '-m', 'xmlrunner', 'discover', 'tests', '-v', '-o', '/out/report']
    copyOut {
        into layout.buildDirectory.dir('test-results')
    }
}

tasks.getByName('check').dependsOn(testEmbeddedServer)

// Prints the version of the deephaven-server wheel this build makes, in Python's form: 43.0-SNAPSHOT becomes
// 43.0+snapshot. It copies the rule in _normalize_version in py/embedded-server/setup.py, which stamps the wheel. Keep
// the two in step: if they differ, an install of the local wheel by this version fails to find the file. Use it to name
// the local wheel, for example
// "build/wheel/deephaven_server-$(./gradlew -q :py-embedded-server:printWheelVersion)-py3-none-any.whl".
tasks.register('printWheelVersion') {
    def javaVersion = project.version.toString()
    doLast {
        def parts = javaVersion.split('-', 2)
        println(parts.length == 2 ? "${parts[0]}+${parts[1].toLowerCase().replaceAll('[-_]', '.')}" : parts[0])
    }
}
