plugins {
    id 'java-library'
    id 'io.deephaven.project.register'
}

dependencies {
    api project(':authentication')
    api project(':authorization')
    api project(':server')
    api(project(':Integrations')) {
        because 'downstream dagger compile'
    }

    implementation project(":util-thread")

    implementation libs.dagger
    annotationProcessor libs.dagger.compiler

    testImplementation libs.dagger
    testAnnotationProcessor libs.dagger.compiler

    implementation platform(libs.grpc.bom)
    implementation libs.grpc.netty

    compileOnly project(':util-immutables')
    annotationProcessor libs.immutables.value

    implementation project(':ssl-kickstart')
    implementation libs.ayza.netty

    implementation project(':grpc-java:grpc-mtls')

    testImplementation project(':server-test-utils')
    testImplementation libs.junit4
    testImplementation libs.assertj

    testRuntimeOnly project(':log-to-slf4j')
    testRuntimeOnly libs.slf4j.simple
}

test.systemProperty "PeriodicUpdateGraph.allowUnitTestMode", false

// Netty 4.2+ defaults to io.netty.noUnsafe=true on Java 25+, breaking Arrow (as of 19)'s casting of PooledDirectByteBuf
// to PooledUnsafeDirectByteBuf. This reenables the use of unsafe, without suppressing the JVM warning. Deliberately
// only changing this one test, so as to ensure we don't require unsafe in other areas.
test.jvmArgs += ['-Dio.netty.noUnsafe=false']

apply plugin: 'io.deephaven.java-open-nio'
