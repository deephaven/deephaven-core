configurations {
    // Resolves the shadow dependencies below, to find which modules the server already provides
    serverProvided {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom configurations.shadow
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        }
    }
}

dependencies {
    implementation libs.pac4j.oidc
    implementation libs.pac4j.http

    // This provider only runs inside a Deephaven server, so it uses the server's libraries instead of bundling its
    // own. The server puts provider jars ahead of its own on the classpath, so a bundled copy of a library the server
    // also has would replace the server's version for the whole server.
    shadow project(':server')
}

def serverModules = configurations.serverProvided.incoming.resolutionResult.rootComponent.map { root ->
    def modules = [] as Set<String>
    def seen = [] as Set
    def visit
    visit = { component ->
        if (seen.add(component)) {
            if (component.moduleVersion != null) {
                modules << "${component.moduleVersion.group}:${component.moduleVersion.name}".toString()
            }
            component.dependencies
                    .findAll { it instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult }
                    .each { visit(it.selected) }
        }
    }
    visit(root)
    modules
}

shadowJar {
    dependencies {
        exclude { serverModules.get().contains("${it.moduleGroup}:${it.moduleName}".toString()) }
    }
    // The server distributions only get these through optional extensions, so they stay bundled; relocate them so
    // they cannot replace the server's copies either
    relocate 'net.minidev', 'io.deephaven.authentication.oidc.shaded.net.minidev'
    relocate 'org.objectweb.asm', 'io.deephaven.authentication.oidc.shaded.org.objectweb.asm'
}
