<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640" role="img" aria-labelledby="t d">
  <title id="t">Messages on a Barrage subscription stream</title>
  <desc id="d">A client opens a DoExchange subscription. The server sends an Arrow schema message, then snapshot pieces with is_snapshot set to true and a growing effective_viewport, interleaved with incremental updates. Each update&#x27;s first FlightData carries BarrageUpdateMetadata in app_metadata, followed by added-row RecordBatches and then modified-row RecordBatches. When the client changes its viewport, the server sends a new snapshot.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="ah-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker></defs>
  <rect x="60" y="20" width="180" height="50" rx="10" fill="#c0c0c0" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="150.0" y="50.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e">Client</text>
  <rect x="620" y="20" width="180" height="50" rx="10" fill="#c0c0c0" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="710.0" y="50.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e">Server</text>
  <line x1="150" y1="70" x2="150" y2="620" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.55"/>
  <line x1="710" y1="70" x2="710" y2="620" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.55"/>
  <line x1="154" y1="120" x2="704" y2="120" stroke="#1c7ed6" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="230.0" y="76" width="400" height="40" rx="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430.0" y="91.33333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e">DoExchange: subscription request</text>
  <text x="430.0" y="109.33333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e">viewport and columns</text>
  <line x1="706" y1="185" x2="156" y2="185" stroke="#1c7ed6" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="230.0" y="141" width="400" height="38" rx="10" fill="#8fd6e1" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430.0" y="164.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e">Arrow schema message</text>
  <line x1="706" y1="255" x2="156" y2="255" stroke="#1c7ed6" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="230.0" y="211" width="400" height="40" rx="10" fill="#f2d273" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430.0" y="226.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e">Snapshot piece</text>
  <text x="430.0" y="244.33333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e">is_snapshot = true, effective_viewport grows</text>
  <line x1="706" y1="325" x2="156" y2="325" stroke="#1c7ed6" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="230.0" y="281" width="400" height="40" rx="10" fill="#8fd6e1" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430.0" y="296.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e">Incremental update</text>
  <text x="430.0" y="314.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e">app_metadata, added rows, then modified rows</text>
  <line x1="706" y1="395" x2="156" y2="395" stroke="#1c7ed6" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="230.0" y="351" width="400" height="40" rx="10" fill="#f2d273" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430.0" y="366.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e">Snapshot piece</text>
  <text x="430.0" y="384.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e">effective_viewport matches the request</text>
  <line x1="706" y1="465" x2="156" y2="465" stroke="#1c7ed6" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="230.0" y="421" width="400" height="40" rx="10" fill="#8fd6e1" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430.0" y="436.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e">Incremental update</text>
  <text x="430.0" y="454.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e">at most once per update interval</text>
  <line x1="154" y1="535" x2="704" y2="535" stroke="#1c7ed6" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="230.0" y="491" width="400" height="40" rx="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430.0" y="506.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e">Viewport change</text>
  <text x="430.0" y="524.3333333333333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e">a new subscription request on the same stream</text>
  <line x1="706" y1="605" x2="156" y2="605" stroke="#1c7ed6" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="230.0" y="561" width="400" height="40" rx="10" fill="#f2d273" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430.0" y="576.3333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e">Snapshot of the new viewport</text>
  <text x="430.0" y="594.3333333333334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e">is_snapshot = true</text>
</svg>
