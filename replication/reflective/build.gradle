plugins {
    id 'java-library'
    id 'io.deephaven.project.register'
}

description 'Reflective Replicators: Source code generators and replicators with compile-time dependencies on their inputs'

dependencies {
    implementation project(':replication-util')
    implementation project(':engine-table')
    implementation libs.javapoet
    implementation libs.dsi.fastutil
    implementation libs.commons.io
    implementation libs.commons.lang3
    implementation libs.javaparser.core

    runtimeOnly project(':log-to-slf4j')
    runtimeOnly project(':configs')
    runtimeOnly project(':test-configs')
    runtimeOnly libs.slf4j.simple

    implementation libs.arrow.vector

    // needed at compile + runtime due to our use of code-generation at runtime
    implementation libs.jetbrains.annotations
    implementation project(':util-annotations')
}

def replicatorPackage = 'io.deephaven.replicators'

// Registers a JavaExec task per entry of a map of task name to replicator class, and returns the registered tasks.
// This has to happen outside of any task configuration action, in which tasks cannot be registered.
def registerReplicators = { Map<String, String> replicators ->
    replicators.collect { taskName, className ->
        Tasks.registerMainExecTask(project, taskName, "${replicatorPackage}.${className}")
    }
}

def replicators = [
    replicateTypedHashers: 'ReplicateTypedHashers',
    replicateTupleSetKernels: 'ReplicateTupleSetKernels',
    generateArrowColumnSources: 'GenerateArrowColumnSources',
    generateArrowColumnTestSources: 'GenerateArrowColumnSourceTests',
    generateQueryLanguageFunctions: 'GenerateQueryLanguageFunctions',
    generateTimsortKernels: 'GenerateTimsortKernels',
]

def replicateAllTasks = registerReplicators(replicators)
tasks.register('replicateAll') {
    dependsOn replicateAllTasks
}
