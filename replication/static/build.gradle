plugins {
    id 'java-library'
    id 'io.deephaven.project.register'
}

description 'Static Replicators: Source code generators and replicators with no compile-time dependency on their inputs'

dependencies {
    implementation project(':Util')
    implementation project(':Base')
    implementation project(':replication-util')
    implementation libs.commons.io
}

def replicatorPackage = 'io.deephaven.replicators'

// Registers a JavaExec task per entry of a map of task name to replicator class, and returns the registered tasks.
// This has to happen outside of any task configuration action, in which tasks cannot be registered.
def registerReplicators = { Map<String, String> replicators ->
    replicators.collect { taskName, className ->
        Tasks.registerMainExecTask(project, taskName, "${replicatorPackage}.${className}")
    }
}

// These replicators do not require any manual fix-up and may be run without supervision
def safeReplicators = [
    replicateVectors: 'ReplicateVectors',
    replicateVectorTests: 'ReplicateVectorTests',
    replicateSourcesAndChunks: 'ReplicateSourcesAndChunks',
    replicateSourceAndChunkTests: 'ReplicateSourceAndChunkTests',
    replicateHashing: 'ReplicateHashing',
    replicateTuples: 'TupleCodeGenerator',
    replicateTupleSources: 'TupleSourceCodeGenerator',
    replicateCopyKernel: 'ReplicateCopyKernel',
    replicateCopyKernelTests: 'ReplicateCopyKernelTests',
    replicateSortKernel: 'ReplicateSortKernel',
    replicateSortKernelTests: 'ReplicateSortKernelTests',
    replicateSortCheck: 'ReplicateSortCheck',
    replicateArrayComparators: 'ReplicateArrayComparators',
    replicateChunkFilters: 'ReplicateChunkFilters',
    replicateColumnIterators: 'ReplicateColumnIterators',
    replicateStampKernel: 'ReplicateStampKernel',
    replicateDupCompactKernel: 'ReplicateDupCompactKernel',
    replicateDupExpandKernel: 'ReplicateDupExpandKernel',
    replicateFillFromElementKernel: 'ReplicateFillFromElementKernel',
    replicateReverseKernel: 'ReplicateReverseKernel',
    replicateSegmentedSortedArray: 'ReplicateSegmentedSortedArray',
    replicateSegmentedSortedArrayTests: 'ReplicateSegmentedSortedArrayTests',
    replicateSegmentedSortedMultiset: 'ReplicateSegmentedSortedMultiset',
    replicateSegmentedSortedMultisetTests: 'ReplicateSegmentedSortedMultisetTests',
    replicateStaticPercentile: 'ReplicateStaticPercentile',
    replicateSetKernel: 'ReplicateSetKernel',
    replicateVectorColumnWrappers: 'ReplicateVectorColumnWrappers',
    replicateUnboxerKernel: 'ReplicateUnboxerKernel',
    replicateOperators: 'ReplicateOperators',
    replicateFreezeBy: 'ReplicateFreezeBy',
    replicateColumnSourceFillBenchmark: 'ReplicateColumnSourceFillBenchmark',
    replicateRegionsAndRegionedSources: 'ReplicateRegionsAndRegionedSources',
    replicateRegionAndRegionedSourceTests: 'ReplicateRegionAndRegionedSourceTests',
    replicateToPage: 'ReplicateToPage',
    replicatePageMaterializers: 'ReplicatePageMaterializers',
    replicateDownsamplingValueTrackers: 'ReplicateDownsamplingValueTrackers',
    replicateBarrageUtils: 'ReplicateBarrageUtils',
    replicateKafka: 'ReplicateKafka',
    replicateRingChunkSources: 'ReplicateRingChunkSources',
    replicateUpdateBy: 'ReplicateUpdateBy',
    replicateRingBuffers: 'ReplicateRingBuffers',
    replicatePrimitiveArrayLists: 'ReplicatePrimitiveArrayLists',
    replicatePrimitiveInterfaces: 'ReplicatePrimitiveInterfaces',
    replicateRangeSearchKernels: 'ReplicateRangeSearchKernels',
    replicateParquetTransferObjects: 'ReplicateParquetTransferObjects',
    replicateColumnStats: 'ReplicateColumnStats',
    replicateCachingSupplier: 'ReplicateCachingSupplier',
    replicateVectorChunkFilters: 'ReplicateVectorChunkFilters',
    replicateParquetPushdownHandlers: 'ReplicateParquetPushdownHandlers',
]

def replicateAllSafeTasks = registerReplicators(safeReplicators)
tasks.register('replicateAllSafe') {
    dependsOn replicateAllSafeTasks
}

// These replicators need manual fix-up post replication and should not be run without supervision
def unsafeReplicators = [
    replicateParquetChunkedWriters: 'ReplicateParquetChunkedWriters',
    replicateTableLocationKey: 'ReplicateTableLocationKey',
]

def replicateAllUnsafeTasks = registerReplicators(unsafeReplicators)
tasks.register('replicateAllUnsafe') {
    dependsOn replicateAllUnsafeTasks
}
