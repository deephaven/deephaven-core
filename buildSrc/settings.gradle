// Plugins (settings plugins, and plugins applied by id and version) are resolved with their dependencies from here.
// Each artifact should come from exactly one repository: the Gradle plugin portal serves the plugin markers (the
// artifacts that map a plugin id to its implementation) and the plugin implementations that Maven Central doesn't host.
// Everything else, such as the dependencies of a plugin, comes from Maven Central; the portal would only redirect those
// to Maven Central itself.
pluginManagement {
    repositories {
        exclusiveContent {
            forRepository {
                gradlePluginPortal()
            }
            filter {
                // Plugin markers: group is the plugin id, module is "<plugin id>.gradle.plugin".
                includeModuleByRegex '.*', '.*\\.gradle\\.plugin'
                // Plugin implementations that Maven Central doesn't host
                includeModule 'org.gradle.toolchains', 'foojay-resolver'
            }
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
}
rootProject.name = 'buildSrc'

// Repositories are declared here, centrally, and buildSrc/build.gradle must not declare its own
// (FAIL_ON_PROJECT_REPOS). Each artifact should come from exactly one repository: the plugin portal (which also mirrors
// Maven Central) is only used for the plugins that Maven Central doesn't host; everything else comes from Maven Central.
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        exclusiveContent {
            forRepository {
                gradlePluginPortal()
            }
            filter {
                includeGroup 'de.esoco.gwt'
                includeGroup 'com.bmuschko'
            }
        }
        mavenCentral()
    }
}
