plugins {
  id 'java'
}

def runtimeVersion = Integer.parseInt((String)project.findProperty('runtimeVersion') ?: '21')
def testRuntimeVersion = Integer.parseInt((String)project.findProperty('testRuntimeVersion') ?: '21')

//    Caused by: java.lang.reflect.InaccessibleObjectException: Unable to make field long java.nio.Buffer.address accessible: module java.base does not "opens java.nio" to unnamed module @5a42bbf4
//     at java.base/java.lang.reflect.AccessibleObject.checkCanSetAccessible(AccessibleObject.java:354)
//     at java.base/java.lang.reflect.AccessibleObject.checkCanSetAccessible(AccessibleObject.java:297)
//     at java.base/java.lang.reflect.Field.checkCanSetAccessible(Field.java:178)
//     at java.base/java.lang.reflect.Field.setAccessible(Field.java:172)
//     at org.apache.arrow.memory.util.MemoryUtil.<clinit>(MemoryUtil.java:84)
//     ... 15 more

if (runtimeVersion > 8) {
  tasks.withType(JavaExec).configureEach {
    jvmArgs += ['--add-opens', 'java.base/java.nio=ALL-UNNAMED']
  }

  tasks.withType(CreateStartScripts).configureEach {
    defaultJvmOpts += ['--add-opens', 'java.base/java.nio=ALL-UNNAMED']
  }

  // TODO(deephaven-core#1493): add-opens Docker application based on plugin conventions
}

if (testRuntimeVersion > 8) {
  tasks.withType(Test).configureEach {
    jvmArgs += ['--add-opens', 'java.base/java.nio=ALL-UNNAMED']
  }
}

// netty 4.2 sets io.netty.noUnsafe=true by default on Java 25+, so PooledByteBufAllocator hands back
// PooledDirectByteBuf instead of PooledUnsafeDirectByteBuf. arrow-memory-netty-buffer-patch's PooledByteBufAllocatorL
// unconditionally casts to PooledUnsafeDirectByteBuf, throwing:
//     class io.netty.buffer.PooledDirectByteBuf cannot be cast to class io.netty.buffer.PooledUnsafeDirectByteBuf
//     at io.netty.buffer.PooledByteBufAllocatorL$InnerAllocator.newDirectBufferL(PooledByteBufAllocatorL.java:185)
//     at org.apache.arrow.memory.netty.NettyAllocationManager.<init>(NettyAllocationManager.java:74)
// Passing -Dio.netty.noUnsafe=false re-enables netty's use of sun.misc.Unsafe (netty reads the resulting
// io.netty.noUnsafe system property) and silences the JDK's terminally-deprecated-method warnings. The other option
// would be to use "--sun-misc-unsafe-memory-access=allow" which doesn't exist on older JDKs.
tasks.withType(JavaExec).configureEach {
  jvmArgs += ['-Dio.netty.noUnsafe=false']
}

tasks.withType(CreateStartScripts).configureEach {
  defaultJvmOpts += ['-Dio.netty.noUnsafe=false']
}

tasks.withType(Test).configureEach {
  jvmArgs += ['-Dio.netty.noUnsafe=false']
}
