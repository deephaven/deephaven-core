name: Publish Check CI results

# WARNING:
# workflow_run provides read-write repo token and access to secrets.
# Do *not* merge changes to this file without the proper review.
# We should only be running trusted code here.
on:
  workflow_run:
    workflows: ["Check CI"]
    types:
      - completed

jobs:
  # Job based on https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
  publish-check-ci:
    runs-on: ubuntu-24.04
    steps:
      # Unfortunately, the official actions/download-artifact action is very limited in scope.
      # Can't use it yet in this context, https://github.com/actions/download-artifact/issues/60
      - name: Download artifacts
        id: download
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            var artifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{ github.event.workflow_run.id }},
               per_page: 100,
            });
            // One "check-ci-<gradle task>-results" artifact per suite that ran: "checks" always,
            // and the categorized suites only on engine/ and coverage/ pull requests. The
            // "-jvm-err" artifacts are deliberately not matched here.
            var matchArtifacts = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name.startsWith("check-ci-") && artifact.name.endsWith("-results")
            });
            if (matchArtifacts.length == 0) {
              // The jobs in Check CI are skipped for docs-only changes (and similar
              // path-filtered cases), so nothing uploads results. That's expected, not an
              // error, so just skip publishing instead of reporting an empty run.
              console.log('No check-ci-*-results artifacts found for this run; the check jobs were likely skipped. Nothing to publish.');
              core.setOutput('found', 'false');
              return;
            }
            var fs = require('fs');
            fs.mkdirSync('${{ github.workspace }}/artifacts', { recursive: true });
            for (const matchArtifact of matchArtifacts) {
              console.log(`Downloading ${matchArtifact.name}`);
              var download = await github.rest.actions.downloadArtifact({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 artifact_id: matchArtifact.id,
                 archive_format: 'zip',
              });
              fs.writeFileSync(`${{ github.workspace }}/artifacts/${matchArtifact.name}.zip`, Buffer.from(download.data));
            }
            core.setOutput('found', 'true');
      # Each suite is unzipped into its own directory so that two suites cannot collide on a
      # path; the report globs through them either way.
      - name: Unzip artifacts
        if: steps.download.outputs.found == 'true'
        run: |
          for zip in artifacts/*.zip; do
            unzip -q -o "$zip" -d "results/$(basename "$zip" .zip)"
          done
      - name: Publish Test Results
        if: steps.download.outputs.found == 'true'
        uses: ScalableCapital/action-surefire-report@4004a71652495d6ed111f5b717c2cf9aa0f37627 # v2.0.5
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        with:
          check_name: check-ci test report
          commit: ${{ github.event.workflow_run.head_sha }}
          report_paths: '**/build/test-results/*/TEST-*.xml'
