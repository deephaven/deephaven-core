name: Gradle Dependency Cache

# The only writer of the Gradle dependency cache; every other job restores it through .github/actions/gradle-setup.
# Each seed starts from an empty Gradle user home, so the entry holds exactly the current dependencies.
on:
  schedule:
    # Early in the ISO week, which is part of the cache key.
    - cron: '30 0 * * 1'
  # The files hashed into the cache key in .github/actions/gradle-setup.
  push:
    branches: [ 'main' ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'buildSrc/build.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - '.github/scripts/resolve-all-dependencies.gradle'
      - '.github/workflows/gradle-deps-cache.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  seed:
    if: ${{ github.repository_owner == 'deephaven' || github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDKs
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: |
            21

      - name: Setup Gradle
        id: gradle
        uses: ./.github/actions/gradle-setup
        with:
          seed: 'true'

      - name: Setup gradle properties
        if: ${{ steps.gradle.outputs.cache-hit != 'true' }}
        run: |
          .github/scripts/gradle-properties.sh 21 >> gradle.properties
          cat gradle.properties

      # spotlessCheck resolves its formatter artifacts at task time, outside any configuration.
      - name: Resolve dependencies
        if: ${{ steps.gradle.outputs.cache-hit != 'true' }}
        run: ./gradlew --init-script .github/scripts/resolve-all-dependencies.gradle resolveAllDependencies spotlessCheck

      - name: Save Gradle dependency cache
        if: ${{ steps.gradle.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ steps.gradle.outputs.key }}
