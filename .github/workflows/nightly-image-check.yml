name: Nightly Image Compare CI

on:
  schedule:
    # 10AM EST == 14 UTC
    - cron:  '0 14 * * *'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    if: ${{ github.repository_owner == 'deephaven' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDKs
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: |
            21

      - name: Setup Gradle
        uses: ./.github/actions/gradle-setup
        with:
          maven-central-mirror-url: ${{ vars.MAVEN_CENTRAL_MIRROR_URL }}
          maven-central-mirror-username: ${{ vars.MAVEN_CENTRAL_MIRROR_USERNAME }}
          maven-central-mirror-password: ${{ secrets.MAVEN_CENTRAL_MIRROR_PASSWORD }}

      - name: Setup gradle properties
        run: |
          .github/scripts/gradle-properties.sh 21 >> gradle.properties
          cat gradle.properties

      - name: Run gradle
        run: ./gradlew --continue pullImage compareImage

      - name: Notify Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        id: notify-slack
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DHC_NOTIFY }}
        with:
          webhook-type: webhook-trigger
          # Fail the step if the alert cannot be delivered; the default hides it.
          errors: true
          payload: '{"repository": "${{ github.repository }}", "message": "${{ github.workflow }}/${{ github.job }} failure, some image is out of date", "link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
