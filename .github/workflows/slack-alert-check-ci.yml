name: Slack Alert Check

# Sends each real call-site payload through the action against a local stub, since every call site is failure-gated and never runs.

on:
  pull_request:
    branches: [ 'main', 'rc/v*' ]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/slack-alert-check.py'
  workflow_dispatch:

jobs:
  sites:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.sites }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every call site is on one pin
        run: .github/scripts/slack-alert-check.py pins

      - name: List the call sites
        id: list
        run: echo "sites=$(.github/scripts/slack-alert-check.py sites)" >> "$GITHUB_OUTPUT"

  send:
    needs: sites
    name: ${{ matrix.site.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Slack webhook stub
        run: |
          .github/scripts/slack-alert-check.py serve &
          .github/scripts/slack-alert-check.py wait

      # Keep this pin matching the call sites so Dependabot bumps them together.
      - name: Send the call site payload
        id: send
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: http://127.0.0.1:8899/hook?case=${{ matrix.site.name }}
          webhook-type: webhook-trigger
          errors: true
          retries: "0"
          payload: ${{ matrix.site.payload }}

      - name: Check the action reported success
        env:
          OK: ${{ steps.send.outputs.ok }}
        run: |
          if [ "${OK}" != "true" ]; then
            echo "the action reported ok='${OK}', expected 'true'"
            exit 1
          fi

      - name: Check what the action sent
        run: .github/scripts/slack-alert-check.py verify "${{ matrix.site.name }}"
