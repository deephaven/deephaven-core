name: Slack Alert Check

# Exercises the action against a local stub; every real call site is failure-gated and never runs.

on:
  pull_request:
    branches: [ 'main', 'rc/v*' ]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/slack-alert-contract.py'
  workflow_dispatch:

jobs:
  slack-alert-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Slack webhook stub
        run: |
          .github/scripts/slack-alert-contract.py serve &
          .github/scripts/slack-alert-contract.py wait

      # The three payload shapes in use. Keep these pins matching the call sites.

      # As in nightly-check-ci, nightly-publish-ci, pr-merge-webhook, nightly-docs.
      - name: Send JSON object payload
        id: json-block
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: http://127.0.0.1:8899/hook?case=json-block
          webhook-type: webhook-trigger
          errors: true
          retries: "0"
          payload: |
            {
              "repository": "deephaven/deephaven-core",
              "message": "slack alert contract check",
              "link": "https://github.com/deephaven/deephaven-core"
            }

      # As in nightly-image-check.
      - name: Send single-line JSON payload
        id: json-inline
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: http://127.0.0.1:8899/hook?case=json-inline
          webhook-type: webhook-trigger
          errors: true
          retries: "0"
          payload: '{"repository": "deephaven/deephaven-core", "message": "slack alert contract check", "link": "https://github.com/deephaven/deephaven-core"}'

      # As in publish-ci. Not JSON, so the only shape needing the YAML parser.
      - name: Send YAML key/value payload
        id: yaml-kv
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: http://127.0.0.1:8899/hook?case=yaml-kv
          webhook-type: webhook-trigger
          errors: true
          retries: "0"
          payload: |
            step_id: "slack-alert-contract"
            action_url: "https://github.com/deephaven/deephaven-core"

      - name: Check the action reported success
        env:
          OK_JSON_BLOCK: ${{ steps.json-block.outputs.ok }}
          OK_JSON_INLINE: ${{ steps.json-inline.outputs.ok }}
          OK_YAML_KV: ${{ steps.yaml-kv.outputs.ok }}
        run: |
          set -o errexit
          status=0
          for name in OK_JSON_BLOCK OK_JSON_INLINE OK_YAML_KV; do
            value="${!name}"
            if [ "${value}" != "true" ]; then
              echo "${name} was '${value}', expected 'true'"
              status=1
            fi
          done
          exit "${status}"

      - name: Check what the action sent
        run: .github/scripts/slack-alert-contract.py verify
