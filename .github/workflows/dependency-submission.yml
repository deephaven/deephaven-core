name: Dependency Submission

on:
  push:
    branches: [ 'main' ]

permissions:
  contents: write

# Maven Central mirror, see .github/gradle/maven-central-mirror.init.gradle. Unset (e.g. on forks) means no mirror.
env:
  MAVEN_CENTRAL_MIRROR_URL: ${{ vars.MAVEN_CENTRAL_MIRROR_URL }}
  MAVEN_CENTRAL_MIRROR_USERNAME: ${{ vars.MAVEN_CENTRAL_MIRROR_USERNAME }}
  MAVEN_CENTRAL_MIRROR_PASSWORD: ${{ secrets.MAVEN_CENTRAL_MIRROR_PASSWORD }}

jobs:
  dependency-submission:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDKs
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: |
            21

      # dependency-submission sets up Gradle itself.
      - name: Restore Gradle dependency cache
        uses: ./.github/actions/gradle-setup
        with:
          setup-gradle: 'false'

      - name: Setup gradle properties
        run: |
          .github/scripts/gradle-properties.sh 21 >> gradle.properties
          cat gradle.properties

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: external
        env:
          # Dependencies derived from :server-jetty-app runtimeClasspath get a "runtime" scope and everything else gets
          # a "development" scope. Ideally, gradle would be able to pass along the finer dependency details (for
          # example, the exact configuration scopes), but this is a limitation of GitHub dependency submissions API, see
          # note in https://github.com/gradle/actions/tree/main/dependency-submission#limiting-the-dependencies-that-appear-in-the-dependency-graph
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_PROJECTS: ':server-jetty-app'
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: 'runtimeClasspath'
