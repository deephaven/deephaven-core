name: Gradle Dependency Cache (release)

# Seeds a release branch's Gradle dependency cache on each push, so only branches with recent commits keep an entry;
# idle ones expire after 7 days unread. A separate workflow because main's push trigger is filtered by path.
on:
  push:
    branches: [ 'release/v*' ]

permissions:
  contents: read

jobs:
  seed:
    uses: ./.github/workflows/gradle-deps-cache.yml
