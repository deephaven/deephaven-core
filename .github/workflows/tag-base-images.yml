name: Tag Base Images CI

on:
  push:
    branches: [ 'main', 'tag/**', 'release/v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-base-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDKs
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: |
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Setup Crane
        if: ${{ startsWith(github.ref, 'refs/heads/release/v') }}
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          # the action's default is latest-release, which downloads a different crane on every run
          version: v0.22.1

      - name: Setup gradle properties
        run: |
          .github/scripts/gradle-properties.sh 21 >> gradle.properties
          cat gradle.properties

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Crane scripts
        run: ./gradlew createCraneTagScript

      - name: Tag upstream images
        if: ${{ startsWith(github.ref, 'refs/heads/release/v') }}
        run: |
          ./docker/registry/cpp-clients-multi-base/build/crane/retag.sh
          ./docker/registry/protoc-base/build/crane/retag.sh
          ./docker/registry/slim-base/build/crane/retag.sh
          ./docker/registry/server-base/build/crane/retag.sh
