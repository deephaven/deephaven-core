name: Check CI

on:
  pull_request:
    branches: [ 'main', 'rc/v*' ]
  push:
    branches: [ 'main', 'check/**', 'release/v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      non-docs: ${{ steps.filter.outputs.non-docs }}
    steps:
      # Must checkout for push, but not pull_request according to the action
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for non-docs changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Ignored by the action if it is a pull_request event
          base: ${{ github.ref }}
          filters: |
            non-docs:
              - '!docs/**'

  checks:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.non-docs == 'true' || startsWith(github.ref, 'refs/heads/release/v') }}
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
        with:
          remove_haskell: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/share/gradle"
          testing: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: ./.github/actions/gradle-suite
        with:
          gradle-task: check

  # The categorized suites that Nightly Check CI runs on a push. Running them here as well lets
  # auto-merge on an oob/ or coverage/ pull request be gated on them. github.head_ref is empty for
  # push events, so they are skipped everywhere else -- a skipped job still reports a check run,
  # which is what makes these safe to mark as required.
  test-serial:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.non-docs == 'true' && (startsWith(github.head_ref, 'oob/') || startsWith(github.head_ref, 'coverage/')) }}
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
        with:
          remove_haskell: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/share/gradle"
          testing: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: ./.github/actions/gradle-suite
        with:
          gradle-task: testSerial

  test-parallel:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.non-docs == 'true' && (startsWith(github.head_ref, 'oob/') || startsWith(github.head_ref, 'coverage/')) }}
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
        with:
          remove_haskell: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/share/gradle"
          testing: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: ./.github/actions/gradle-suite
        with:
          gradle-task: testParallel

  test-out-of-band:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.non-docs == 'true' && (startsWith(github.head_ref, 'oob/') || startsWith(github.head_ref, 'coverage/')) }}
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
        with:
          remove_haskell: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/share/gradle"
          testing: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: ./.github/actions/gradle-suite
        with:
          gradle-task: testOutOfBand
