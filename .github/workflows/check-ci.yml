name: Check CI

on:
  pull_request:
    branches: [ 'main', 'rc/v*' ]
  push:
    branches: [ 'main', 'check/**', 'release/v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      non-docs: ${{ steps.filter.outputs.non-docs }}
    steps:
      # Must checkout for push, but not pull_request according to the action
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
      - name: Check for non-docs changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Ignored by the action if it is a pull_request event
          base: ${{ github.ref }}
          filters: |
            non-docs:
              - '!docs/**'

  checks:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.non-docs == 'true' || startsWith(github.ref, 'refs/heads/release/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - uses: ./.github/actions/gradle-suite
        with:
          gradle-task: check

  # The categorized suites that Nightly Check CI runs on a push. Running them here as well lets
  # auto-merge on an engine/ or coverage/ pull request be gated on them. github.head_ref is empty for
  # push events, so they are skipped everywhere else -- a skipped job still reports a check run,
  # which is what makes these safe to mark as required.
  test-serial:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.non-docs == 'true' && (startsWith(github.head_ref, 'engine/') || startsWith(github.head_ref, 'coverage/')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - uses: ./.github/actions/gradle-suite
        with:
          gradle-task: testSerial

  test-parallel:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.non-docs == 'true' && (startsWith(github.head_ref, 'engine/') || startsWith(github.head_ref, 'coverage/')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - uses: ./.github/actions/gradle-suite
        with:
          gradle-task: testParallel

  test-out-of-band:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.non-docs == 'true' && (startsWith(github.head_ref, 'engine/') || startsWith(github.head_ref, 'coverage/')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - uses: ./.github/actions/gradle-suite
        with:
          gradle-task: testOutOfBand
