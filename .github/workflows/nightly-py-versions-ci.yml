name: Nightly Python Versions CI

# Runs the py/server and py/client test suites on every supported Python version. The Docker-based suites run only on
# the Python in the server image and the python registry image. These run the same tests on the JVM from the
# deephaven-server wheel, so each version needs only Python, a JDK and that wheel. The rest installs from source.
#
# Floor: python_requires in py/server/setup.py. Ceiling: the newest Python that every dependency has a wheel for
# (jpy has none for 3.15 yet). The free-threaded 3.14t build runs with the GIL kept off.

on:
  schedule:
    # 3AM EST == 7AM UTC, an hour after Nightly Check CI
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches: [ 'nightly/**', 'py-versions/**' ]

jobs:
  build:
    if: ${{ github.repository_owner == 'deephaven' || github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup JDKs
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: |
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup gradle properties
        run: |
          .github/scripts/gradle-properties.sh 21 >> gradle.properties
          cat gradle.properties

      - name: Build the deephaven-server wheel and the test classes
        # The tests load a few Java test classes: CalendarInit from engine-time, and MyObject and
        # PythonTimeComponentsTest from Integrations.
        run: ./gradlew --scan :py-embedded-server:assemble :Integrations:testClasses :engine-time:testClasses

      - name: Upload the deephaven-server wheel and the test classes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: py-versions-build
          path: |
            py/embedded-server/build/wheel/*.whl
            Integrations/build/classes/java/test/
            engine/time/build/classes/java/test/
          retention-days: 1

  test:
    name: test (${{ matrix.suite }}, Python ${{ matrix.python-version }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # 3.14t is the free-threaded build. 3.13t is left out: grpcio and numba have no 3.13t wheels.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.14t']
        suite: ['server', 'client']
    runs-on: ubuntu-24.04
    env:
      DEEPHAVEN_MAXMEM: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Download the deephaven-server wheel and the test classes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: py-versions-build

      - name: Setup JDKs
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: |
            21

      - name: Setup uv
        # run-tests-embedded.sh uses uv to download the Python version and create the venv.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install Graphviz
        if: ${{ matrix.suite == 'server' }}
        # tests/test_perfmon.py renders an SVG through graphviz-java. Without the dot binary it needs the GraalJS jars,
        # which are on the Integrations test classpath but not in the deephaven-server wheel.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends graphviz

      - name: Start Kafka and Postgres
        if: ${{ matrix.suite == 'server' }}
        # The Kafka and database tests reach these services by the host names "redpanda" and "postgres".
        run: |
          echo "127.0.0.1 redpanda postgres" | sudo tee -a /etc/hosts
          docker compose -f Integrations/docker-compose.yml up -d --wait

      - name: Run tests
        # The same scripts run behind ./gradlew :py-server:testEmbedded and :py-client:testEmbedded. uv picks older numpy,
        # pandas, pyarrow and numba releases on the older Pythons, since the newest ones dropped them. So those runs test
        # different dependency versions.
        run: py/${{ matrix.suite }}/run-tests-embedded.sh ${{ matrix.python-version }}

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-py-versions-${{ matrix.suite }}-py${{ matrix.python-version }}-ci-results
          path: py/${{ matrix.suite }}/build/test-results/test-embedded/**

      - name: Upload JVM Error Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: nightly-py-versions-${{ matrix.suite }}-py${{ matrix.python-version }}-ci-jvm-err
          path: |
            **/*_pid*.log
            **/core.*
          if-no-files-found: ignore
