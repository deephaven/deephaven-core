version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows and a root action.yml; composite actions live under .github/actions.
    directories:
      - "/"
      - "/.github/actions/*"
    groups:
      # One pull request per action across all directories, so their pins stay in step.
      github-actions:
        patterns:
          - "*"
        group-by: dependency-name
    open-pull-requests-limit: 99
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(github-actions)"
    labels:
      - "NoDocumentationNeeded"
      - "NoReleaseNotesNeeded"
      - "version-bump"
    assignees:
      - "devinrsmith"
      - "stanbrub"
  - package-ecosystem: "gradle"
    directory: "/"
    open-pull-requests-limit: 99
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(gradle)"
    labels:
      - "NoDocumentationNeeded"
      - "NoReleaseNotesNeeded"
      - "version-bump"
    assignees:
      - "devinrsmith"
      - "rcaudy"
  - package-ecosystem: "gomod"
    directory: "/go"
    open-pull-requests-limit: 99
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(gomod)"
    labels:
      - "NoDocumentationNeeded"
      - "NoReleaseNotesNeeded"
      - "version-bump"
    assignees:
      - "cpwright"
